language = "C"
header = """/*
 * imbh.h — C API for IMBH (the embeddable observability database).
 *
 * GENERATED by cbindgen from the imbh-c crate. Do not edit by hand; regenerate with `cargo build`.
 *
 * Query results are handed back as an Arrow C Data Interface `struct ArrowArrayStream`, whose native
 * type comes from Arrow's own <arrow/c/abi.h> (a copy is bundled at include/arrow/c/abi.h; a consumer
 * with Arrow installed picks up theirs). The caller owns the stream and must release it
 * (`stream.release(&stream)`) or hand it to an Arrow importer that takes ownership.
 */"""
include_guard = "IMBH_H"
tab_width = 4
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
# Pull the Arrow C Data Interface types from Arrow's own header, so the C surface uses Arrow's native
# `struct ArrowArrayStream` (not a bespoke copy). Resolves to the consumer's Arrow install if present,
# else the bundled genuine copy on our include path.
after_includes = "\n#include <arrow/c/abi.h>"
documentation = true
documentation_style = "doxy"

[export]
# Arrow's native struct comes from <arrow/c/abi.h>; cbindgen must not emit its own definition.
exclude = ["FFI_ArrowArrayStream", "ArrowArrayStream"]

[export.rename]
# Reference Arrow's native type by its canonical C spelling `struct ArrowArrayStream` (arrow-rs's
# FFI_ArrowArrayStream is layout-identical). Arrow's abi.h provides no bare typedef, so the `struct`
# keyword is required for the reference to compile in C.
"FFI_ArrowArrayStream" = "struct ArrowArrayStream"

[enum]
# Rust `imbh_table::Logs` → C `IMBH_TABLE_LOGS`, `imbh_error::NotFound` → `IMBH_ERROR_NOT_FOUND`, etc.
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false

[parse]
parse_deps = false
